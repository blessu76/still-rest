name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # BACKUP only. Scheduled journal posts (front matter `publish_at`, KST) go live at random times inside two windows
    # (am 09:00-11:59, pm 16:00-17:59); the MAIN trigger is the Mac mini dispatcher (scripts/dispatch_due.py, launchd every 5 min,
    # `gh workflow run`). GitHub cron is UTC and can start hours late (2026-10-24: ~4h50m), so it only sweeps the windows once an hour.
    - cron: '45 0-3 * * *'   # 09:45 10:45 11:45 12:45 KST (covers the am window)
    - cron: '45 7-9 * * *'   # 16:45 17:45 18:45 KST (covers the pm window)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Verify (tests, committed pages up to date, safety data)
        # The committed pages are clock-free: scheduled posts (`publish_at`) are NOT in them, so this check never goes stale as time passes
        # (push and cron runs alike). --strict-safety: once any journal post is published, its language's crisis-line data must be `verified`.
        run: |
          python3 -m unittest discover -s tests
          python3 scripts/build_journal.py --check --strict-safety

      - name: Publish scheduled posts that are due (built in the runner only, never committed)
        # One clock for the build and the sitemap check (KST, minute precision). Posts whose `publish_at` is at or before it go live.
        run: |
          NOW="$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          echo "publish clock: $NOW KST"
          echo "PUBLISH_NOW=$NOW" >> "$GITHUB_ENV"   # the IndexNow step below uses the very same clock
          python3 scripts/build_journal.py --now "$NOW" --strict-safety
          python3 scripts/check_sitemap.py --now "$NOW"

      - name: Assemble site (repo root minus sources)
        # content/ (home template + strings, journal .md sources), scripts/ and tests/ are build-time only — never public raw URLs.
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a --exclude='/.git' --exclude='/.github' --exclude='/content' --exclude='/scripts' --exclude='/tests' ./ "$RUNNER_TEMP/site/"

      - name: Remember the sitemap that is live right now (IndexNow sends only what is new)
        # Taken BEFORE the deploy replaces it. A failed download is fine: IndexNow then sends all of today's URLs.
        continue-on-error: true
        run: curl -fsS --max-time 30 -o "$RUNNER_TEMP/live-sitemap.xml" https://still.ipe.rest/sitemap.xml

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: IndexNow — tell Bing/Naver/Yandex about the URLs that changed in this deploy
        # Only pages whose sitemap lastmod is today (KST) and that are not already live: the new posts, the lists and the home pages. A post that is
        # still scheduled is not in the runner's sitemap, so it is never sent early; it goes out in the run that publishes it. The key file
        # (the <32 hex>.txt in the repo root) is a public file, not a secret. A failure here never fails the deploy (the site is already live).
        id: indexnow
        continue-on-error: true
        run: python3 scripts/indexnow.py --changed --now "$PUBLISH_NOW" --previous "$RUNNER_TEMP/live-sitemap.xml"

      - name: Notify Slack — success
        if: success() && env.SLACK_BOT_TOKEN != ''
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          HEAD_COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_ID: ${{ github.run_id }}
          INDEXNOW: ${{ steps.indexnow.outcome }}
        run: |
          COMMIT_MSG=$(printf '%s' "$HEAD_COMMIT_MSG" | head -1)
          [ -n "$COMMIT_MSG" ] || COMMIT_MSG="${{ github.event_name }} ${GITHUB_SHA::7}"  # cron / manual runs have no head commit
          TEXT=$(printf '🕊️ *still.ipe.rest 배포 완료*\n_보고: Paul (Head of Reach) → #release-note_\n\n• 커밋: `%s`\n• URL: https://still.ipe.rest\n• IndexNow: %s' "$COMMIT_MSG" "$INDEXNOW")
          PAYLOAD=$(jq -nc \
            --arg channel "C0BJ1EF5PC0" \
            --arg text "$TEXT" \
            '{channel: $channel, text: $text, mrkdwn: true}')
          curl -s -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "$PAYLOAD"

      - name: Notify Slack — failure
        if: failure() && env.SLACK_BOT_TOKEN != ''
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          HEAD_COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_ID: ${{ github.run_id }}
        run: |
          COMMIT_MSG=$(printf '%s' "$HEAD_COMMIT_MSG" | head -1)
          [ -n "$COMMIT_MSG" ] || COMMIT_MSG="${{ github.event_name }} ${GITHUB_SHA::7}"  # cron / manual runs have no head commit
          TEXT=$(printf '❌ *still.ipe.rest 배포 실패 — 즉시 확인 필요*\n_보고: Paul (Head of Reach) → #release-note_\n\n• 커밋: `%s`\n• Actions: https://github.com/blessu76/still-rest/actions/runs/%s' "$COMMIT_MSG" "$RUN_ID")
          PAYLOAD=$(jq -nc \
            --arg channel "C0BJ1EF5PC0" \
            --arg text "$TEXT" \
            '{channel: $channel, text: $text, mrkdwn: true}')
          curl -s -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "$PAYLOAD"
